
allprojects {
    repositories {
        // Dev-only opt-in via -PuseMavenLocal (kept out of default clean-env resolution).
        if (project.hasProperty('useMavenLocal')) { mavenLocal() }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
