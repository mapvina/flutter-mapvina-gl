name: Publish Flutter Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Publish mapvina_gl_platform_interface
        run: |
          cd mapvina_gl_platform_interface
          dart pub publish --force
      
      - name: Wait for pub.dev indexing
        run: sleep 60
      
      - name: Publish mapvina_gl_web
        run: |
          cd mapvina_gl_web
          dart pub publish --force
      
      - name: Wait for pub.dev indexing
        run: sleep 60
      
      - name: Publish mapvina_gl
        run: |
          cd mapvina_gl
          dart pub publish --force
